<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hanuman Bhakti | Devotional Music</title>

    <meta name="description"
          content="Hanuman Bhakti - A peaceful collection of Hanuman and Shri Ram devotional music.">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="hanuman-bg.png">
</head>

<body>

    <main class="page">

        <!-- Blurred background used only to fill empty screen space -->
        <div class="background-fill"></div>

        <!-- Full Hanuman image -->
        <img
            src="hanuman-bg.png"
            class="hanuman-background"
            alt="Lord Hanuman"
        >

        <!-- Slight dark overlay so text is readable -->
        <div class="overlay"></div>


        <section class="content">

            <div class="title-area">

                <h1>हनुमान भक्ति</h1>

                <div class="divider">
                    <span></span>
                    <span class="flag">🚩</span>
                    <span></span>
                </div>

                <p>
                    शक्ति
                    <span>•</span>
                    भक्ति
                    <span>•</span>
                    शांति
                </p>

            </div>


            <div class="music-player">

                <div class="song-info">

                    <div class="song-cover">
                        🚩
                    </div>

                    <div class="song-text">

                        <h2 id="songTitle">
                            Hanuman Aavahan
                        </h2>

                        <p>Hanuman Bhakti</p>

                    </div>

                </div>


                <div class="progress-area">

                    <div class="progress-bar">
                        <div id="progressFill"></div>
                    </div>

                    <div class="time">

                        <span id="currentTime">
                            0:00
                        </span>

                        <span id="duration">
                            --:--
                        </span>

                    </div>

                </div>


                <div class="controls">

    <!-- Shuffle -->
    <button
        id="shuffleBtn"
        title="Shuffle"
        aria-label="Shuffle"
    >
        <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M16 3h5v5"></path>
            <path d="M4 20L21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15l6 6"></path>
            <path d="M4 4l5 5"></path>
        </svg>
    </button>

    <!-- Previous -->
    <button
        id="prevBtn"
        title="Previous"
    >
        ⏮
    </button>

    <!-- Play / Pause -->
    <button
        id="playBtn"
        class="play-btn"
        title="Play"
    >
        ▶
    </button>

    <!-- Next -->
    <button
        id="nextBtn"
        title="Next"
    >
        ⏭
    </button>

    <!-- Repeat -->
    <button
        id="repeatBtn"
        title="Repeat"
        aria-label="Repeat"
    >
        <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M17 1l4 4-4 4"></path>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <path d="M7 23l-4-4 4-4"></path>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
    </button>

</div>

            </div>

        </section>

    </main>
<audio id="audioPlayer" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
